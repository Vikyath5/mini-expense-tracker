<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <h1>Mini Expense Tracker</h1>

        <div class="total-section">
            <h2>Total Spent</h2>
            <p id="totalAmount">₹0.00</p>
        </div>

        <form id="expenseForm">
            <input type="text" id="expenseName" placeholder="Expense name">

            <input type="number" id="expenseAmount" placeholder="Amount" min="0" step="0.01">

            <select id="expenseCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Add Expense</button>
        </form>

        <h2>Expenses</h2>

        <input type="text" id="expenseFilter" placeholder="Filter expenses...">

        <ul id="expenseList"></ul>
    </div>

    <script src="js/filter.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/expenses.js"></script>
</body>

</html>
